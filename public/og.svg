<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="paper" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FBFBF8"/>
      <stop offset="100%" stop-color="#F1F1EC"/>
    </radialGradient>
    <radialGradient id="plasma1" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#8E5BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8E5BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plasma2" cx="65%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#4D7CFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4D7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8E5BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8E5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#plasma1)"/>
  <rect width="1200" height="630" fill="url(#plasma2)"/>

  <text x="80" y="100" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#6B7185" text-transform="uppercase">§ RESEARCH &amp; PRODUCT LAB</text>

  <text x="80" y="280" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="120" font-weight="340" letter-spacing="-4" fill="#0E1426">Small fires.</text>
  <text x="80" y="410" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="120" font-weight="340" letter-spacing="-4" fill="#0E1426">Built to spread.</text>

  <circle cx="985" cy="378" r="50" fill="url(#emberGlow)"/>
  <circle cx="985" cy="378" r="11" fill="#8E5BFF"/>

  <text x="80" y="560" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="32" font-weight="440" fill="#0E1426">Slow Lit Labs</text>

  <text x="1120" y="560" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6B7185" text-anchor="end">EUROPE / GLOBAL</text>
</svg>
