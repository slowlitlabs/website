<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="paper" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FBF9F6"/>
      <stop offset="100%" stop-color="#F3EFE7"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85D2C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E85D2C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- Top label -->
  <text x="80" y="100" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#6B6660" text-transform="uppercase">§ RESEARCH &amp; PRODUCT LAB</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="120" font-weight="340" letter-spacing="-4" fill="#1A1814">Small fires.</text>
  <text x="80" y="410" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="120" font-weight="340" letter-spacing="-4" fill="#1A1814">Built to spread.</text>

  <!-- Ember glow + dot beside the headline -->
  <circle cx="985" cy="378" r="50" fill="url(#emberGlow)"/>
  <circle cx="985" cy="378" r="11" fill="#E85D2C"/>

  <!-- Wordmark -->
  <text x="80" y="560" font-family="Fraunces, Iowan Old Style, Baskerville, serif" font-size="32" font-weight="440" fill="#1A1814">Cinder Labs</text>
  <circle cx="290" cy="552" r="6" fill="#E85D2C"/>

  <!-- Right meta -->
  <text x="1120" y="560" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="1" fill="#6B6660" text-anchor="end">EUROPE / GLOBAL</text>
</svg>
